# -------------------------------------------------------------------------
# FULL CI/CD PIPELINE: Build, Test, Push to ACR, and Deploy to AKS
# -------------------------------------------------------------------------

trigger:
  branches:
    include:
      - iq-line # Trigger on code commits to the main branch

resources:
  repositories:
  - repository: self

# Use the Variable Group created in the Azure DevOps Library
variables:
  - group: Azure-Variables  # Must exist in Azure DevOps Pipelines > Library > Variable Groups
  - name: projectRoot
    value: '$(System.DefaultWorkingDirectory)'
  - name: buildId
    value: '$(Build.BuildId)'
  # Fallback defaults if Variable Group is missing (REMOVE after Variable Group is created)
  - name: acrName
    value: 'devopsassignacr.azurecr.io'
  - name: resourceGroupName
    value: 'devopsassign-rg'
  - name: aksClusterName
    value: 'devopsassign-aks'
  - name: app_insights_ikey
    value: ''  # Must be set in Variable Group (mark as secret)

# FIX: Set pool to use your self-hosted agent
pool:
  # name: MySelfHostedPool
  vmImage: 'ubuntu-latest'  # Temporary: Use Microsoft-hosted agent while debugging

stages: 
# =========================================================================
# STAGE 1: CI (Build, Test, Containerize, Push)
# =========================================================================
- stage: BuildTestAndPush
  displayName: 'CI: Build, Test, & Push Containers'
  jobs:
  
  # Job 1: Build and push API Gateway
  - job: BuildGateway
    displayName: 'Build & Push: api-gateway'
    variables:
      serviceName: 'api-gateway'
    steps:
    - checkout: self
      
    # NEW DEBUG STEP: Show the entire directory structure checked out by the agent
    - script: |
        echo "--- Debug: Listing Recursive Contents of Repository Root ---"
        ls -R $(System.DefaultWorkingDirectory)
        echo "------------------------------------------------------------"
      displayName: 'Debug: List Full Repo Contents'

    # Python Setup & Install Dependencies (Fixed path to python3.11, removed UsePythonVersion@0)
    - script: |
        echo "Verifying Python 3.11 installation..."
        python3.11 --version
        echo "Installing dependencies for $(serviceName)..."
        # Using full path to ensure success
        python3.11 -m pip install -r $(System.DefaultWorkingDirectory)/devops-microservices/$(serviceName)/requirements.txt
      displayName: 'Verify Python & Install Dependencies: $(serviceName)'

    - task: Docker@2
      displayName: 'Build Docker Image: $(serviceName)'
      inputs:
        command: build
        azureSubscription: 'azure-service-connection'
        azureContainerRegistry: '$(acrName)'
        repository: '$(acrName)/$(serviceName)'
        Dockerfile: 'devops-microservices/$(serviceName)/Dockerfile'
        buildContext: 'devops-microservices/$(serviceName)'
        tags: |
          $(buildId)
          latest

    - task: AzureCLI@2
      displayName: 'Login to ACR before push'
      inputs:
        azureSubscription: 'azure-service-connection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Logging in to ACR $(acrName)..."
          az acr login --name $(acrName)

    - task: Docker@2
      displayName: 'Push Image to ACR: $(serviceName)'
      inputs:
        command: push
        azureSubscription: 'azure-service-connection'
        azureContainerRegistry: '$(acrName)'
        repository: '$(acrName)/$(serviceName)'
        tags: |
          $(buildId)
          latest

  # Job 2: Build and push User Service
  - job: BuildUser
    displayName: 'Build & Push: user-service'
    dependsOn: BuildGateway
    variables:
      serviceName: 'user-service'
    steps:
    - checkout: self
      
    # Python Setup & Install Dependencies 
    - script: |
        echo "Verifying Python 3.11 installation..."
        python3.11 --version
        echo "Installing dependencies for $(serviceName)..."
        # Using full path for robust installation
        python3.11 -m pip install -r $(System.DefaultWorkingDirectory)/devops-microservices/$(serviceName)/requirements.txt
        echo "Running unit tests for User Service..."
        cd $(System.DefaultWorkingDirectory)/devops-microservices/$(serviceName)
        python3.11 -m unittest test_app
      displayName: 'Verify Python, Install Deps & Run Tests: $(serviceName)'

    - task: Docker@2
      displayName: 'Build Docker Image: $(serviceName)'
      inputs:
        command: build
        azureSubscription: 'azure-service-connection'
        azureContainerRegistry: '$(acrName)'
        repository: '$(acrName)/$(serviceName)'
        Dockerfile: 'devops-microservices/$(serviceName)/Dockerfile'
        buildContext: 'devops-microservices/$(serviceName)'
        tags: |
          $(buildId)
          latest

    - task: AzureCLI@2
      displayName: 'Login to ACR before push'
      inputs:
        azureSubscription: 'azure-service-connection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Logging in to ACR $(acrName)..."
          az acr login --name $(acrName)

    - task: Docker@2
      displayName: 'Push Image to ACR: $(serviceName)'
      inputs:
        command: push
        azureSubscription: 'azure-service-connection'
        azureContainerRegistry: '$(acrName)'
        repository: '$(acrName)/$(serviceName)'
        tags: |
          $(buildId)
          latest

  # Job 3: Build and push Order Service
  - job: BuildOrder
    displayName: 'Build & Push: order-service'
    dependsOn: BuildUser
    variables:
      serviceName: 'order-service'
    steps:
    - checkout: self
      
    # Python Setup & Install Dependencies
    - script: |
        echo "Verifying Python 3.11 installation..."
        python3.11 --version
        echo "Installing dependencies for $(serviceName)..."
        # Using full path for robust installation
        python3.11 -m pip install -r $(System.DefaultWorkingDirectory)/devops-microservices/$(serviceName)/requirements.txt
      displayName: 'Verify Python & Install Dependencies: $(serviceName)'

    - task: Docker@2
      displayName: 'Build Docker Image: $(serviceName)'
      inputs:
        command: build
        azureSubscription: 'azure-service-connection'
        azureContainerRegistry: '$(acrName)'
        repository: '$(acrName)/$(serviceName)'
        Dockerfile: 'devops-microservices/$(serviceName)/Dockerfile'
        buildContext: 'devops-microservices/$(serviceName)'
        tags: |
          $(buildId)
          latest

    - task: AzureCLI@2
      displayName: 'Login to ACR before push'
      inputs:
        azureSubscription: 'azure-service-connection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Logging in to ACR $(acrName)..."
          az acr login --name $(acrName)

    - task: Docker@2
      displayName: 'Push Image to ACR: $(serviceName)'
      inputs:
        command: push
        azureSubscription: 'azure-service-connection'
        azureContainerRegistry: '$(acrName)'
        repository: '$(acrName)/$(serviceName)'
        tags: |
          $(buildId)
          latest

  # Publish K8s manifests after all services are built
  - job: PublishManifests
    displayName: 'Publish K8s Manifests'
    dependsOn:
      - BuildGateway
      - BuildUser
      - BuildOrder
    steps:
    - task: PublishPipelineArtifact@1
      displayName: 'Publish Artifact: Deployment Manifests'
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/devops-microservices/k8s-manifests'
        artifact: 'k8s-deployment-manifests'
        publishLocation: 'pipeline'

# =========================================================================
# STAGE 2: CD (Deploy to AKS)
# =========================================================================
- stage: DeployToAKS
  displayName: 'CD: Deploy Microservices to AKS'
  dependsOn: BuildTestAndPush # Only run if CI succeeds
  condition: succeeded()
  jobs:
  - job: DeployMicroservices
    displayName: 'Deployment Job'
    # Using the self-hosted agent pool name
    pool:
      name: MySelfHostedPool
    steps:
    
    # Download the K8s manifests published by the CI stage
    - task: DownloadPipelineArtifact@2
      displayName: 'Download K8s Manifests'
      inputs:
        artifact: 'k8s-deployment-manifests'
        path: '$(Pipeline.Workspace)/k8s-manifests'
              
    # 1. Kubernetes Manifest Replacement (iKey, ACR name, etc.)
    - task: Bash@3
      displayName: 'Replace Tokens in K8s Manifests (envsubst)'
      inputs:
        targetType: 'inline'
        script: |
          # Install envsubst (gettext-base) on Linux agents
          if ! command -v envsubst >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gettext-base
          fi

          # Export pipeline variables into shell variables (Azure Pipelines will substitute $(var) before running)
          export acrName="$(acrName)"
          export resourceGroupName="$(resourceGroupName)"
          export aksClusterName="$(aksClusterName)"
          export app_insights_ikey="$(app_insights_ikey)"

          WORKSPACE_DIR="$(Pipeline.Workspace)/k8s-manifests"
          find "$WORKSPACE_DIR" -type f -name '*.yaml' -print0 | while IFS= read -r -d '' file; do
            tmp="${file}.tmp"
            # Convert $(VAR) -> ${VAR} so envsubst can use environment variables
            sed -E 's/\$\(([A-Za-z_][A-Za-z0-9_]*)\)/\${\1}/g' "$file" > "$tmp"
            envsubst < "$tmp" > "$file"
            rm "$tmp"
          done

          echo "Token replacement complete."

    # 1.5 Install Secrets Store CSI Driver (required for SecretProviderClass)
    - task: AzureCLI@2
      displayName: 'Ensure AKS credentials and install Secrets Store CSI Driver'
      inputs:
        azureSubscription: 'azure-service-connection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -euo pipefail
          echo "Fetching AKS credentials..."
          az aks get-credentials -g $(resourceGroupName) -n $(aksClusterName) --overwrite-existing --admin

          # Ensure helm is installed on the agent
          if ! command -v helm >/dev/null 2>&1; then
            echo "Helm not found. Installing Helm..."
            curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          fi

          echo "Checking if Secrets Store CSI Driver CRD exists..."
          if ! kubectl get crd secretproviderclasses.secrets-store.csi.x-k8s.io >/dev/null 2>&1; then
            echo "Installing Secrets Store CSI Driver via Helm..."
            helm repo add secrets-store-csi-driver https://kubernetes-sigs.github.io/secrets-store-csi-driver/charts
            helm repo update
            helm install csi-secrets-store secrets-store-csi-driver/secrets-store-csi-driver --namespace kube-system --create-namespace --set syncSecret.enabled=true

            echo "Installing Azure Key Vault Provider for Secrets Store CSI Driver..."
            helm repo add azure https://raw.githubusercontent.com/Azure/secrets-store-csi-driver-provider-azure/master/charts
            helm repo update
            helm install azure-provider azure/azure-keyvault-secrets-provider --namespace kube-system --create-namespace

            echo "Waiting for CSI driver daemonset to be ready..."
            kubectl rollout status daemonset/secrets-store-csi-driver -n kube-system --timeout=5m
            echo "Secrets Store CSI Driver installed successfully."
          else
            echo "Secrets Store CSI Driver CRD already present."
          fi

    # 2. Deploy Key Vault SecretProviderClass (First)
    - task: Kubernetes@1
      displayName: 'Deploy Key Vault SecretProviderClass'
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'azure-service-connection'
        azureResourceGroup: '$(resourceGroupName)'
        kubernetesCluster: '$(aksClusterName)'
        command: 'apply'
        arguments: '-f $(Pipeline.Workspace)/k8s-manifests/keyvault-secretprovider.yaml'

    # 3. Deploy all services, HPA, and LoadBalancer
    - task: Kubernetes@1
      displayName: 'Deploy Microservices & HPA to AKS'
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'azure-service-connection'
        azureResourceGroup: '$(resourceGroupName)'
        kubernetesCluster: '$(aksClusterName)'
        command: 'apply'
        arguments: '-f $(Pipeline.Workspace)/k8s-manifests/'
              
    # 4. Verification Step (Optional but recommended)
    - task: AzureCLI@2
      displayName: 'Verify Deployment (Get Gateway IP)'
      inputs:
        azureSubscription: 'azure-service-connection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          # Get Kube config
          az aks get-credentials -g $(resourceGroupName) -n $(aksClusterName) --overwrite-existing --admin
          
          echo "Waiting for API Gateway External IP..."
          kubectl get svc api-gateway-external --watch &
          
          # Wait for 60 seconds (or appropriate time) for the IP to provision
          sleep 60 
          
          GATEWAY_IP=$(kubectl get svc api-gateway-external -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "##vso[task.setvariable name=GatewayExternalIP;isOutput=true]$GATEWAY_IP"
          echo "API Gateway External IP: $GATEWAY_IP"