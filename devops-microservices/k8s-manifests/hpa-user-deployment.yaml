# 2. Horizontal Pod Autoscaler (Cost Optimization / Scalability)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user-service
  minReplicas: 2 # Minimum cost (right-sizing)
  maxReplicas: 5 # Max scale (scalability)
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70 # Scale out when average CPU exceeds 70%